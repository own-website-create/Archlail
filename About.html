body{
    margin:0;
    background:black;

}

.about-card{
    position:relative;

    width:min(90vw,700px);

.scroll{
    position:fixed;

    left:0;

}

    display:none;
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(0,0,50,0.9);
    border:2px solid pink;
    border-radius:10px;
    padding:10px;
}

.menu a{
    display:block;
    color:Pink;
    text-decoration:none;

.menu a:hover{
