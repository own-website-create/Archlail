<html>
<head>
</head>
<style>
#rotate-message{
    display:none;

    position:fixed;
    top:0;
    left:0;

    width:100vw;
    height:100vh;

    background:black;
    color:white;

    z-index:9999;

    justify-content:center;
    align-items:center;

    text-align:center;
}
.rotate-content{
    font-size:1.5rem;
}
@media (orientation: portrait){

    #rotate-message{
        display:flex;
    }

}
h1{
border:3px groove White;
border-radius:3em;
color:Fuchsia;
box-shadow:3px 5px 4px blue;
text-shadow:3px 1px 2px red;
}
.center-image{
    display:flex;
    justify-content:center;
    align-items:center;
}

.center-image img{
    max-width:80%;
    max-height:80vh;
    border-radius:15px;
    box-shadow:0 0 25px pink;
}
.gallery-image{
    cursor:pointer;
    transition:0.3s;
}

.gallery-image:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px Fuchsia;
}
#lightbox{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100vh;

    background:rgba(0,0,0,0.95);

    justify-content:center;
    align-items:center;

    z-index:20002;
}

#lightbox-img{

    max-width:90%;
    max-height:90%;
}

#close-btn{

    position:absolute;

    top:20px;
    right:30px;

    color:white;

    font-size:50px;

    cursor:pointer;
}
.menu-btn{
    position:absolute;
    top:60px;
    left:10px;
    font-size:30px;
    background:Pink;
    border:none;
    color:rgba(0,0,50,0.9);
    cursor:pointer;
}

.menu{
    display:none;
    position:absolute;
    top:60px;
    left:10px;
    background:rgba(0,0,50,0.9);
    border:2px solid pink;
    border-radius:10px;
    padding:10px;
}

.menu a{
    display:block;
    color:Pink;
    text-decoration:none;
    padding:20px 30px;
}

.menu a:hover{
    background:Pink;
    color:black;
}
</style>
<body background="Ancient Background.png">
<div id="rotate-message">
    <div class="rotate-content">
        📱↻
        <h2>Please Rotate Your Phone</h2>
        <p>This website is best viewed in landscape mode.</p>
    </div>
</div>

</div>

    <a href="About.html">About</a>
</div>

</div>

</body>
</html>
